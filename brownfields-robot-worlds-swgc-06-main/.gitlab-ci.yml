image: maven:3.9.6-eclipse-temurin-21

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"   # goal: run on every commit to main

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: maven-repo
  paths: [ .m2/repository/ ]

before_script:
  - apt-get update -qq && apt-get install -y -qq make git lsof  # make is NOT in the maven image
  - mkdir -p .lms/.flow            # flow-recorder guard (its System.exit hazard)
  - git config user.email "${GITLAB_USER_EMAIL:-robot-worlds-ci@wethinkcode.co.za}"  # flow's GitInfo needs a git identity - CI runners never set one. GitLab fills GITLAB_USER_* with whoever pushed; the fallback only covers pipelines with no user context (schedules, API triggers)
  - git config user.name  "${GITLAB_USER_NAME:-robot-worlds-ci}"

stages: [build, test, package, acceptance, release]

compile:        { stage: build,      script: [make compile] }
unit-test:      { stage: test,       script: [make unit-test],
                  artifacts: { when: always, name: unit-test-reports,
                               paths: [target/surefire-reports/],
                               reports: { junit: target/surefire-reports/TEST-*.xml } } }
package-server: { stage: package,    script: [make package],
                  artifacts: { paths: [target/robot-world-*-jar-with-dependencies.jar] } }
acceptance:     { stage: acceptance, script: [make test] }
release-jar:    { stage: release,    script: [make build-release],
                  artifacts: { paths: [target/robot-world-*-jar-with-dependencies.jar] } }

# Publish the Docker image to this project's container registry
# ($CI_REGISTRY_IMAGE, e.g. gitlab.wethinkco.de:5050/<namespace>/<project>).
# Login uses the job's temporary CI_JOB_TOKEN, so no personal access token
# is stored anywhere. The fat JAR comes from the package-server job's
# artifacts; the image is only published if every earlier stage -
# compile, unit tests, packaging, acceptance - has passed.
publish-image:
  stage: release
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

